[project]
name = "darts-ml"
version = "0.0.0"
description = "Darts Scorer's data tools: ingest, label, check and measure the owner's Photos"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "tomli-w>=1.2.0",
]

[project.scripts]
darts-ml = "darts_ml.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"
