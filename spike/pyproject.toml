[project]
name = "m2-spike"
version = "0.0.0"
description = "Throwaway M2 toolchain trial: synthetic boards, a heatmap model, export, phone run"
requires-python = ">=3.12,<3.13"
dependencies = [
    "darts-ml",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "torch>=2.6",
    "timm>=1.0.15",
    "litert-torch>=0.10.0",
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
    "onnxscript>=0.7.2",
]

[tool.uv.sources]
darts-ml = { path = "../ml" }

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"
